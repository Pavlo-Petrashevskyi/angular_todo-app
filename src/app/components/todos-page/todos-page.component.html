<div class="todoapp">
  <h1 class="todoapp__title">todos</h1>

  <div class="todoapp__content">
    <header class="todoapp__header">
      <!-- {/* this button should have `active` class only if all todos are completed */} -->
      <button
        type="button"
        class="todoapp__toggle-all active"
      ></button>

      <app-todo-form (save)="addTodo($event)"/>
    </header>

    <section class="todoapp__main">
      <app-todo
        *ngFor="let todo of visibleTodos$ | async; let copyIndex = index; trackBy: trackById"
        [todo]="todo"
        (delete)="deleteTodo(todo)"
        (rename)="renameTodo(todo, $event)"
        (toggle)="toggleTodo(todo)"
      />
    </section>

    <!-- {/* Hide the footer if there are no todos */} -->
    <footer class="todoapp__footer" data-cy="Footer">
      <span class="todo-count" data-cy="TodosCounter">
        {{(activeCount$ | async)}} {{(activeCount$ | async) === 1 ?  'item left' : 'items left'}}
      </span>

      <app-filter />

      <!-- {/* this button should be disabled if there are no completed todos */} -->
      <button
        type="button"
        class="todoapp__clear-completed"
        data-cy="ClearCompletedButton"
      >
        Clear completed
      </button>
    </footer>
  </div>

  <app-message />
</div>
